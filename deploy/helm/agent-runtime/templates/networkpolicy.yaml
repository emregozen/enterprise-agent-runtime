{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-run-egress
  namespace: {{ .Values.runNamespace }}
spec:
  podSelector:
    matchLabels:
      app: agent-run
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    # Conjur and CCP are not on this list. The control plane resolves those
    # secrets into the per-run Secret. Run pods, including the executor, never dial the PAM.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openshift-dns
      ports:
        - protocol: UDP
          port: 5353
        - protocol: TCP
          port: 5353
    # Artifact upload uses this existing hop. Run pods do not mount the artifact PVC.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespace }}
          podSelector:
            matchLabels:
              app: control-plane
      ports:
        - protocol: TCP
          port: 8841
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.namespace }}
          podSelector:
            matchLabels:
              app: postgres
      ports:
        - protocol: TCP
          port: 5432
    {{- range .Values.networkPolicy.extraEgress }}
    - to:
        - ipBlock:
            cidr: {{ .cidr }}
            {{- $except := index . "except" | default list }}
            {{- if $except }}
            except:
              {{- toYaml $except | nindent 14 }}
            {{- end }}
      ports:
        - protocol: TCP
          port: {{ .port }}
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: control-plane-ingress
  namespace: {{ .Values.namespace }}
spec:
  podSelector:
    matchLabels:
      app: control-plane
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ui
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.runNamespace }}
          podSelector:
            matchLabels:
              app: agent-run
      ports:
        - protocol: TCP
          port: 8841
{{- end }}
