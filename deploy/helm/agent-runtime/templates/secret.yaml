apiVersion: v1
kind: Secret
metadata:
  name: agent-runtime-env
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres:5432/{{ .Values.postgres.database }}
  SALES_ADMIN_URL: postgresql+psycopg://postgres:{{ .Values.postgres.adminPassword }}@postgres:5432/sales
  SALES_DATABASE_URL: postgresql+psycopg://sales_ro:{{ .Values.salesRoPassword }}@postgres:5432/sales
  SALES_RO_PASSWORD: {{ .Values.salesRoPassword | quote }}
  POSTGRESQL_PASSWORD: {{ .Values.postgres.password | quote }}
  POSTGRESQL_ADMIN_PASSWORD: {{ .Values.postgres.adminPassword | quote }}
  LLM_API_KEY: {{ .Values.llm.apiKey | quote }}
  EMAIL_API_TOKEN: {{ .Values.tools.emailApiToken | quote }}
  SMS_API_TOKEN: {{ .Values.tools.smsApiToken | quote }}
  HTTP_TOOL_TOKEN: {{ .Values.tools.httpToolToken | quote }}
  S3_ACCESS_KEY: {{ .Values.artifacts.s3AccessKey | quote }}
  S3_SECRET_KEY: {{ .Values.artifacts.s3SecretKey | quote }}
