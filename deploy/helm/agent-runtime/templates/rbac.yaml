apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-controller
  namespace: {{ .Values.namespace }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-run
  namespace: {{ .Values.runNamespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-run-controller
  namespace: {{ .Values.runNamespace }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "patch", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-run-controller
  namespace: {{ .Values.runNamespace }}
subjects:
  - kind: ServiceAccount
    name: agent-controller
    namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-run-controller
{{- if .Values.grantImagePuller }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-runs-image-puller
  namespace: {{ .Values.namespace }}
subjects:
  - kind: ServiceAccount
    name: agent-run
    namespace: {{ .Values.runNamespace }}
  - kind: ServiceAccount
    name: default
    namespace: {{ .Values.runNamespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
{{- end }}
