{{- $name := "agent-runtime-master-key" }}
{{- $existing := lookup "v1" "Secret" .Values.namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Values.namespace }}
  annotations:
    description: Master key for secrets stored in Postgres. Helm reuses the live key on upgrade.
type: Opaque
stringData:
  {{- if and $existing (index $existing.data "key") }}
  key: {{ index $existing.data "key" | b64dec | quote }}
  {{- else }}
  key: {{ randAlphaNum 48 | quote }}
  {{- end }}
