services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agentrt
      POSTGRES_PASSWORD: agentrt
      POSTGRES_DB: agentrt
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/compose/init.sql:/docker-entrypoint-initdb.d/01-sales.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentrt -d agentrt"]
      interval: 5s
      timeout: 3s
      retries: 20

  control-plane:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.runtime
    environment:
      DATABASE_URL: postgresql+psycopg://agentrt:agentrt@postgres:5432/agentrt
      SALES_DATABASE_URL: postgresql+psycopg://sales_ro:sales_ro@postgres:5432/sales
      SALES_ADMIN_URL: postgresql+psycopg://agentrt:agentrt@postgres:5432/sales
      SALES_RO_PASSWORD: sales_ro
      PORT: "8841"
      LLM_MODE: fake
      RUN_BACKEND: local
      SEED_DEMO: "true"
      SEED_SALES_ROWS: "20000"
      SCHEDULER_ENABLED: "true"
      CONTROL_PLANE_PUBLIC_URL: http://127.0.0.1:8841
      CONTROL_PLANE_INTERNAL_URL: http://control-plane:8841
      ARTIFACT_BACKEND: local
      ARTIFACT_DIR: /tmp/artifacts
      WORK_ROOT: /tmp/work
      LOG_DIR: /tmp/logs
      EMAIL_RECIPIENT_ALLOWLIST: finans@sirket.local,*@sirket.local
    ports:
      - "8841:8841"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8841/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 30

  ui:
    build:
      context: ./ui
      args:
        CONTROL_PLANE_URL: http://control-plane:8841
    environment:
      CONTROL_PLANE_URL: http://control-plane:8841
      PORT: "8842"
    ports:
      - "8842:8842"
    depends_on:
      control-plane:
        condition: service_healthy

  oracle:
    profiles: ["oracle"]
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: oracle
    ports:
      - "1521:1521"

  seaweedfs:
    profiles: ["s3"]
    image: chrislusf/seaweedfs:3.80
    command: ["server", "-s3", "-dir=/data"]
    ports:
      - "8833:8333"

volumes:
  pgdata:
